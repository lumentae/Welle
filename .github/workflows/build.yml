name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: lumentae/actions/.github/workflows/build-cpp.yml@main
    with:
      python_packages: meson
      system_packages: libsystemd-dev libelogind-dev
  release:
    permissions:
      contents: write
    needs: build
    uses: lumentae/actions/.github/workflows/release.yml@main